<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cart — TicketWave</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="logo">Ticket<span>Wave</span></a>
    <nav>
      <a href="/">Events</a>
      <a href="/cart.html" class="active">My Cart</a>
    </nav>
    <a href="/cart.html" class="cart-btn" id="cart-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      Cart
      <span class="cart-count hidden" id="cart-count">0</span>
    </a>
  </div>
</header>

<main>
  <div class="section-header">
    <h2>My Cart</h2>
    <span class="badge" id="cart-badge">Loading…</span>
  </div>

  <div id="cart-content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading your cart…</p>
    </div>
  </div>
</main>

<div class="toast-container" id="toasts"></div>

<script src="/js/common.js"></script>
<script>
  async function loadCart() {
    const content = document.getElementById('cart-content');
    const badge = document.getElementById('cart-badge');

    try {
      const res = await fetch('/api/cart');
      const items = await res.json();

      const totalQty = items.reduce((s, i) => s + i.quantity, 0);
      const totalPrice = items.reduce((s, i) => s + i.quantity * i.price, 0);

      badge.textContent = `${totalQty} item${totalQty !== 1 ? 's' : ''}`;
      updateCartCount(totalQty);

      if (items.length === 0) {
        content.innerHTML = `
          <div class="cart-empty">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <p>Your cart is empty.</p>
            <a href="/" class="btn-add-cart" style="width:auto;padding:12px 28px;border-radius:8px;text-decoration:none">
              Browse Events
            </a>
          </div>
        `;
        return;
      }

      const itemsHtml = items.map(item => `
        <div class="cart-item" id="cart-item-${item.concert_id}">
          <img
            src="https://picsum.photos/seed/${escHtml(item.image_seed)}/200/113"
            alt="${escHtml(item.artist)}"
          />
          <div class="cart-item-info">
            <div class="cart-item-artist">${escHtml(item.artist)}</div>
            <div class="cart-item-venue">
              ${escHtml(item.venue)} &middot; ${formatDate(item.event_date)}
            </div>
            <div class="cart-item-meta">
              <span class="cart-item-price">$${(item.quantity * item.price).toFixed(2)}</span>
              <span class="cart-item-qty">${item.quantity} × $${Number(item.price).toFixed(2)}</span>
            </div>
          </div>
          <button class="btn-remove" onclick="removeItem(${item.concert_id})">Remove</button>
        </div>
      `).join('');

      content.innerHTML = `
        <div class="cart-layout">
          <div id="cart-items-list">${itemsHtml}</div>

          <div>
            <div class="order-summary">
              <h3>Order Summary</h3>

              ${items.map(item => `
                <div class="summary-row">
                  <span>${escHtml(item.artist)} × ${item.quantity}</span>
                  <span>$${(item.quantity * item.price).toFixed(2)}</span>
                </div>
              `).join('')}

              <div class="summary-row total" id="total-row">
                <span>Total</span>
                <span id="total-price">$${totalPrice.toFixed(2)}</span>
              </div>

              <button class="btn-checkout" onclick="checkout()">
                Proceed to Checkout
              </button>
            </div>
          </div>
        </div>
      `;
    } catch (err) {
      content.innerHTML = '<p style="color:var(--danger);padding:40px;text-align:center">Failed to load cart.</p>';
    }
  }

  async function removeItem(concertId) {
    try {
      const res = await fetch(`/api/cart/${concertId}`, { method: 'DELETE' });
      const data = await res.json();
      updateCartCount(data.cart_count);
      showToast('Item removed from cart.', 'success');
      loadCart();
    } catch (err) {
      showToast('Failed to remove item.', 'error');
    }
  }

  function checkout() {
    showToast('Checkout coming soon! This is a prototype.', 'success');
  }

  loadCart();
  loadCartCount();
</script>
</body>
</html>
