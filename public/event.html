<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Details — TicketWave</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="logo">Ticket<span>Wave</span></a>
    <nav>
      <a href="/">Events</a>
      <a href="/cart.html">My Cart</a>
    </nav>
    <a href="/cart.html" class="cart-btn" id="cart-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      Cart
      <span class="cart-count hidden" id="cart-count">0</span>
    </a>
  </div>
</header>

<main>
  <a href="/" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back to Events
  </a>

  <div id="detail-content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading event…</p>
    </div>
  </div>
</main>

<div class="toast-container" id="toasts"></div>

<script src="/js/common.js"></script>
<script>
  let currentConcert = null;
  let quantity = 1;

  const params = new URLSearchParams(window.location.search);
  const concertId = params.get('id');

  if (!concertId) window.location.href = '/';

  async function loadConcert() {
    const container = document.getElementById('detail-content');

    try {
      const res = await fetch(`/api/concerts/${concertId}`);
      if (!res.ok) throw new Error('Not found');
      currentConcert = await res.json();

      document.title = `${currentConcert.artist} — TicketWave`;

      const dateStr = formatDate(currentConcert.event_date);
      const dayOfWeek = formatDayOfWeek(currentConcert.event_date);

      container.innerHTML = `
        <div class="detail-layout">
          <div>
            <div class="detail-img-wrap">
              <img
                src="https://picsum.photos/seed/${escHtml(currentConcert.image_seed)}/800/450"
                alt="${escHtml(currentConcert.artist)} at ${escHtml(currentConcert.venue)}"
              />
            </div>

            <div class="detail-info" style="margin-top:32px">
              <h1 class="detail-artist">${escHtml(currentConcert.artist)}</h1>

              <div class="detail-tags">
                <div class="tag">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                  ${dayOfWeek}, ${escHtml(dateStr)}
                </div>
                <div class="tag">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                  </svg>
                  ${escHtml(currentConcert.venue)}
                </div>
              </div>

              <p class="detail-description">${escHtml(currentConcert.description)}</p>
            </div>
          </div>

          <div>
            <div class="ticket-box">
              <div class="ticket-box-title">Get Tickets</div>

              <div class="ticket-price-big">$${Number(currentConcert.price).toFixed(2)}</div>
              <div class="ticket-price-sub">per ticket (fees included)</div>

              <div class="qty-control">
                <button class="qty-btn" id="qty-minus" onclick="changeQty(-1)">−</button>
                <div class="qty-display" id="qty-display">1</div>
                <button class="qty-btn" id="qty-plus" onclick="changeQty(1)">+</button>
              </div>

              <button class="btn-add-cart" id="add-to-cart-btn" onclick="addToCart()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                  <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                Add to Cart
              </button>

              <hr class="ticket-divider" />

              <div class="ticket-detail-row">
                <span>Venue</span>
                <strong>${escHtml(currentConcert.venue)}</strong>
              </div>
              <div class="ticket-detail-row">
                <span>Date</span>
                <strong>${escHtml(dateStr)}</strong>
              </div>
              <div class="ticket-detail-row">
                <span>Price each</span>
                <strong>$${Number(currentConcert.price).toFixed(2)}</strong>
              </div>
              <div class="ticket-detail-row" id="subtotal-row">
                <span>Subtotal</span>
                <strong id="subtotal">$${Number(currentConcert.price).toFixed(2)}</strong>
              </div>
            </div>
          </div>
        </div>
      `;
    } catch (err) {
      container.innerHTML = '<p style="color:var(--danger);padding:40px;text-align:center">Event not found.</p>';
    }
  }

  function changeQty(delta) {
    quantity = Math.max(1, Math.min(10, quantity + delta));
    document.getElementById('qty-display').textContent = quantity;
    if (currentConcert) {
      document.getElementById('subtotal').textContent =
        '$' + (quantity * currentConcert.price).toFixed(2);
    }
  }

  async function addToCart() {
    const btn = document.getElementById('add-to-cart-btn');
    btn.disabled = true;
    btn.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Adding…
    `;

    try {
      const res = await fetch('/api/cart', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ concert_id: currentConcert.id, quantity }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed');

      updateCartCount(data.cart_count, true);
      showToast(`${quantity} ticket${quantity > 1 ? 's' : ''} added to cart!`, 'success');

      btn.classList.add('success');
      btn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Added to Cart!
      `;

      setTimeout(() => {
        btn.classList.remove('success');
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          Add to Cart
        `;
      }, 2500);
    } catch (err) {
      showToast('Failed to add to cart. Please try again.', 'error');
      btn.disabled = false;
      btn.innerHTML = `Add to Cart`;
    }
  }

  loadConcert();
  loadCartCount();
</script>
</body>
</html>
